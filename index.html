<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔥 Safe/Game - Extintores</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --orange:#ff5500;
  --amber:#ffaa00;
  --dark:#0e0e0e;
  --card:#181818;
  --card2:#1f1f1f;
  --text:#f0f0f0;
  --muted:#888;
  --water:#1e88e5;
  --co2:#546e7a;
  --pqs:#ef6c00;
  --correct:#2e7d32;
  --wrong:#c62828;
}

body{
  background:var(--dark);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}

/* Background embers */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255,85,0,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 20%, rgba(255,170,0,0.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:440px;
}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:28px;
}
.header-icon{font-size:36px;line-height:1;}
.header-text{}
.header-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;letter-spacing:2px;
  color:var(--orange);
  line-height:1;
}
.header-sub{
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-top:2px;
}

/* ── PROGRESS ── */
.progress-wrap{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
}
.progress-bar{
  flex:1;height:6px;background:#2a2a2a;border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));
  border-radius:99px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.progress-label{
  font-size:13px;font-weight:700;color:var(--muted);
  white-space:nowrap;
}

/* ── SCORE ── */
.score-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}
.score-badge{
  background:var(--card2);
  border:1px solid #2e2e2e;
  border-radius:12px;
  padding:8px 16px;
  font-size:13px;color:var(--muted);
  display:flex;gap:6px;align-items:center;
}
.score-badge span{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:var(--amber);letter-spacing:1px;
}
.streak-badge{
  background:var(--card2);
  border:1px solid #2e2e2e;
  border-radius:12px;
  padding:8px 16px;
  font-size:13px;color:var(--muted);
  display:flex;gap:6px;align-items:center;
}
.streak-badge span{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:#ff5500;letter-spacing:1px;
}

/* ── FIRE CARD ── */
.fire-card{
  background:var(--card);
  border:1px solid #2a2a2a;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
  transition:border-color .3s;
}
.fire-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--amber),transparent);
  border-radius:20px 20px 0 0;
}

.class-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:#2a2a2a;border-radius:8px;
  padding:4px 10px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--amber);font-weight:700;
  margin-bottom:14px;
}

.fire-emoji{
  font-size:52px;
  display:block;
  margin-bottom:12px;
  animation:flicker 1.8s ease-in-out infinite;
}

@keyframes flicker{
  0%,100%{transform:scale(1) rotate(-1deg);filter:brightness(1);}
  30%{transform:scale(1.06) rotate(1deg);filter:brightness(1.2);}
  60%{transform:scale(.97) rotate(-2deg);filter:brightness(.9);}
  80%{transform:scale(1.04) rotate(1deg);filter:brightness(1.1);}
}

.fire-type{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;letter-spacing:1px;
  color:var(--text);margin-bottom:8px;
}
.fire-desc{
  font-size:14px;line-height:1.6;color:#aaa;
}

/* class badge */
.type-pill{
  display:inline-block;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  font-weight:700;
  padding:3px 10px;border-radius:99px;
  margin-top:12px;
}
.pill-a{background:rgba(255,85,0,.15);color:#ff7744;border:1px solid rgba(255,85,0,.3);}
.pill-b{background:rgba(255,170,0,.15);color:#ffcc44;border:1px solid rgba(255,170,0,.3);}
.pill-c{background:rgba(84,110,122,.2);color:#90a4ae;border:1px solid rgba(84,110,122,.4);}
.pill-k{background:rgba(85,139,47,.15);color:#8bc34a;border:1px solid rgba(85,139,47,.3);}

/* ── BUTTONS ── */
.buttons{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin-bottom:20px;
}
.opt-btn{
  background:var(--card2);
  border:1.5px solid #2e2e2e;
  border-radius:16px;
  padding:16px 12px;
  color:var(--text);
  font-family:'Barlow',sans-serif;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:all .25s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;overflow:hidden;
}
.opt-btn:not(:disabled):hover{
  transform:translateY(-3px);
  border-color:#444;
  background:#252525;
}
.opt-btn:not(:disabled):active{transform:scale(.97);}
.opt-btn .btn-icon{font-size:26px;}
.opt-btn .btn-label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}

.opt-btn.water{--accent:var(--water);}
.opt-btn.co2{--accent:var(--co2);}
.opt-btn.pqs{--accent:var(--pqs);}
.opt-btn.foam{--accent:var(--foam);}
.opt-btn.co2k{--accent:#7b1fa2;}

.opt-btn:not(:disabled):hover{border-color:var(--accent,#444);}

.opt-btn.correct-anim{
  border-color:#4caf50!important;
  background:rgba(76,175,80,.15)!important;
  animation:correctPop .4s ease;
}
.opt-btn.wrong-anim{
  border-color:#f44336!important;
  background:rgba(244,67,54,.12)!important;
  animation:wrongShake .4s ease;
}
.opt-btn.reveal-correct{
  border-color:#4caf50!important;
  background:rgba(76,175,80,.1)!important;
}

@keyframes correctPop{
  0%{transform:scale(1);}
  40%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  60%{transform:translateX(6px);}
}

.opt-btn:disabled{opacity:.55;cursor:default;}

/* ── RESULT ── */
.result-box{
  min-height:64px;
  border-radius:14px;
  padding:14px 16px;
  font-size:14px;line-height:1.6;
  font-weight:600;
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
  opacity:0;transform:translateY(6px);
  transition:all .3s ease;
}
.result-box.show{opacity:1;transform:translateY(0);}
.result-box.ok{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);color:#81c784;}
.result-box.fail{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);color:#e57373;}
.result-icon{font-size:22px;flex-shrink:0;}

/* ── NEXT BUTTON ── */
.next-btn{
  width:100%;
  background:linear-gradient(135deg,var(--orange),#ff8800);
  border:none;border-radius:14px;
  padding:16px;
  color:white;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2px;
  cursor:pointer;
  transition:all .25s;
  display:none;
}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,85,0,.4);}
.next-btn:active{transform:scale(.98);}

/* ── END SCREEN ── */
.end-screen{
  text-align:center;padding:10px;
}
.trophy{font-size:64px;display:block;animation:bounce .6s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-12px);}}

.end-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;letter-spacing:3px;
  color:var(--amber);margin-top:16px;
}
.end-score-label{margin-top:8px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.end-score-val{
  font-family:'Bebas Neue',sans-serif;
  font-size:72px;color:var(--orange);letter-spacing:2px;line-height:1;
}
.end-accuracy{
  font-size:14px;color:var(--muted);margin-top:4px;
}
.rating{
  margin:20px 0;
  font-size:14px;color:#ccc;line-height:1.7;
  background:var(--card2);border-radius:14px;padding:16px;
  border:1px solid #2a2a2a;
}
.rating strong{color:var(--amber);}

.replay-btn{
  width:100%;
  background:linear-gradient(135deg,var(--orange),#ff8800);
  border:none;border-radius:14px;
  padding:16px;
  color:white;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2px;
  cursor:pointer;
  margin-top:8px;
  transition:all .25s;
}
.replay-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,85,0,.35);}

/* ── SLIDE-IN ── */
.slide-in{
  animation:slideIn .35s cubic-bezier(.4,0,.2,1);
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(18px);}
  to{opacity:1;transform:translateX(0);}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-icon">🧯</div>
    <div class="header-text">
      <div class="header-title">SAFE/GAME</div>
      <div class="header-sub">Entrenamiento de Brigada</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">1 / 8</div>
  </div>

  <!-- SCORE ROW -->
  <div class="score-row">
    <div class="score-badge">⭐ Puntos <span id="scoreVal">0</span></div>
    <div class="streak-badge">🔥 Racha <span id="streakVal">0</span></div>
  </div>

  <!-- GAME AREA -->
  <div id="gameArea">

    <!-- FIRE CARD -->
    <div class="fire-card" id="fireCard">
      <div class="class-tag" id="classTag">🏷 CLASE X</div>
      <div class="fire-emoji" id="fireEmoji">🔥</div>
      <div class="fire-type" id="fireType">Cargando...</div>
      <div class="fire-desc" id="fireDesc">...</div>
      <div class="type-pill" id="typePill"></div>
    </div>

    <!-- OPTIONS -->
    <div class="buttons" id="buttonsArea"></div>

    <!-- RESULT -->
    <div class="result-box" id="resultBox">
      <span class="result-icon" id="resultIcon"></span>
      <span id="resultText"></span>
    </div>

    <!-- NEXT -->
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
      Siguiente incendio →
    </button>

  </div>

</div>

<script>
const ALL_QUESTIONS = [
  {
    type:"Incendio Eléctrico",
    emoji:"⚡",
    classTag:"CLASE C",
    pill:"pill-c",
    pillText:"Clase C · Equipos eléctricos",
    desc:"Un tablero eléctrico comenzó a arder por un cortocircuito. El área está bajo tensión.",
    correct:"CO2",
    options:["Agua","CO2","PQS"],
    success:"El CO₂ no conduce electricidad y no daña los equipos. ¡Elección perfecta!",
    fail:"El agua conduce electricidad y puede causar electrocución. Aquí se necesita CO₂."
  },
  {
    type:"Fuego de Papelería",
    emoji:"📄",
    classTag:"CLASE A",
    pill:"pill-a",
    pillText:"Clase A · Sólidos combustibles",
    desc:"Papeles y cartones almacenados en la bodega se incendiaron. Sin riesgo eléctrico.",
    correct:"Agua",
    options:["Agua","CO2","PQS"],
    success:"¡Correcto! El agua enfría y empapa los materiales sólidos. Ideal para Clase A.",
    fail:"El mejor extintor para materiales sólidos como papel es el de agua. CO₂ no enfría la brasa."
  },
  {
    type:"Derrame de Gasolina",
    emoji:"⛽",
    classTag:"CLASE B",
    pill:"pill-b",
    pillText:"Clase B · Líquidos inflamables",
    desc:"Un bidón de gasolina se volcó y el combustible se prendió en el taller mecánico.",
    correct:"PQS",
    options:["Agua","CO2","PQS"],
    success:"¡Correcto! El PQS cubre la superficie e interrumpe la reacción química. Ideal para Clase B.",
    fail:"El agua puede dispersar el combustible y extender el fuego. El PQS es lo indicado aquí."
  },
  {
    type:"Aceite en Cocina",
    emoji:"🍳",
    classTag:"CLASE K",
    pill:"pill-k",
    pillText:"Clase K · Aceites de cocina",
    desc:"Una freidora industrial se incendió en la cocina del casino. Llamas altas sobre la sartén.",
    correct:"CO2/K",
    options:["Agua","CO2/K","PQS"],
    success:"¡Correcto! CO₂ o extintor Clase K sofocan sin salpicadura. Nunca agua en aceite caliente.",
    fail:"Agua en aceite caliente provoca explosión de vapor. Se requiere CO₂ o extintor Clase K."
  },
  {
    type:"Archivo en Llamas",
    emoji:"🗄️",
    classTag:"CLASE A",
    pill:"pill-a",
    pillText:"Clase A · Sólidos combustibles",
    desc:"Cajas de madera y archivos de documentos se incendiaron en el depósito. Sin riesgo eléctrico.",
    correct:"Agua",
    options:["Agua","CO2","PQS"],
    success:"¡Bien! El agua es lo más eficaz aquí: enfría la brasa y evita reignición en materiales sólidos.",
    fail:"Para madera y papel, el agua es lo mejor: penetra y enfría la brasa. PQS no evita reignición."
  },
  {
    type:"Laboratorio Químico",
    emoji:"🧪",
    classTag:"CLASE B/C",
    pill:"pill-b",
    pillText:"Clase B/C · Solventes + Electricidad",
    desc:"Solventes inflamables cerca de equipos eléctricos encendidos comenzaron a arder.",
    correct:"CO2",
    options:["Agua","CO2","PQS"],
    success:"¡Perfecto! CO₂ es seguro en eléctrico y eficaz en líquidos. No deja residuo en el laboratorio.",
    fail:"CO₂ es la mejor opción: combate el fuego sin conducir electricidad ni contaminar el laboratorio."
  },
  {
    type:"Vehículo en Llamas",
    emoji:"🚗",
    classTag:"CLASE B",
    pill:"pill-b",
    pillText:"Clase B · Combustible de motor",
    desc:"Un auto derramó gasolina y prendió. El motor arde pero no hay riesgo de choque eléctrico.",
    correct:"PQS",
    options:["Agua","CO2","PQS"],
    success:"¡Exacto! PQS es el más versátil para vehículos: actúa sobre combustibles y evita reignición.",
    fail:"PQS es ideal: cubre el área rápido y actúa en Clase A y B, el más común en vehículos."
  },
  {
    type:"Generador Eléctrico",
    emoji:"🔋",
    classTag:"CLASE C",
    pill:"pill-c",
    pillText:"Clase C · Equipo energizado",
    desc:"El generador de emergencia del edificio comenzó a arder mientras estaba en pleno funcionamiento.",
    correct:"CO2",
    options:["Agua","CO2","PQS"],
    success:"¡Correcto! CO₂ es el agente dieléctrico por excelencia. Seguro y sin residuo en el equipo.",
    fail:"Nunca agua ni PQS en equipos eléctricos activos. CO₂ es el único completamente seguro en Clase C."
  }
];

const EXTINGUISHERS = {
  "Agua":  {icon:"💧", label:"AGUA",  cls:"water"},
  "CO2":   {icon:"❄️", label:"CO₂",   cls:"co2"},
  "PQS":   {icon:"🧡", label:"PQS",   cls:"pqs"},
  "CO2/K": {icon:"❄️", label:"CO₂/K", cls:"co2k"},
};

let questions = [];
let current = 0;
let score = 0;
let streak = 0;
let correctCount = 0;
let answered = false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  questions = shuffle(ALL_QUESTIONS);
  current = 0; score = 0; streak = 0; correctCount = 0;
  updateScoreUI();
  loadQuestion();
}

function loadQuestion(){
  answered = false;
  const q = questions[current];

  // progress
  const pct = (current / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = (current+1) + ' / ' + questions.length;

  // card
  document.getElementById('classTag').textContent = '🏷 ' + q.classTag;
  document.getElementById('fireEmoji').textContent = q.emoji;
  document.getElementById('fireType').textContent = q.type;
  document.getElementById('fireDesc').textContent = q.desc;
  const pill = document.getElementById('typePill');
  pill.className = 'type-pill ' + q.pill;
  pill.textContent = q.pillText;

  document.getElementById('fireCard').classList.add('slide-in');
  setTimeout(()=>document.getElementById('fireCard').classList.remove('slide-in'), 400);

  // buttons
  const area = document.getElementById('buttonsArea');
  area.innerHTML = '';
  const opts = shuffle(q.options);
  opts.forEach(opt => {
    const e = EXTINGUISHERS[opt];
    const btn = document.createElement('button');
    btn.className = 'opt-btn ' + e.cls;
    btn.innerHTML = `<span class="btn-icon">${e.icon}</span>🧯<br><span class="btn-label">${e.label}</span>`;
    btn.onclick = () => checkAnswer(opt, btn);
    area.appendChild(btn);
  });

  // result
  const rb = document.getElementById('resultBox');
  rb.className = 'result-box';
  document.getElementById('resultIcon').textContent = '';
  document.getElementById('resultText').textContent = '';

  document.getElementById('nextBtn').style.display = 'none';
}

function checkAnswer(chosen, btn){
  if(answered) return;
  answered = true;

  const q = questions[current];
  const isCorrect = chosen === q.correct;

  // feedback on buttons
  const allBtns = document.querySelectorAll('#buttonsArea .opt-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    const label = b.querySelector('.btn-label').textContent.replace('₂','2');
    const optKey = Object.keys(EXTINGUISHERS).find(k => EXTINGUISHERS[k].label.replace('₂','2') === label || EXTINGUISHERS[k].label === b.querySelector('.btn-label').textContent);
    if(optKey === q.correct) b.classList.add('reveal-correct');
  });

  if(isCorrect){
    btn.classList.add('correct-anim');
    score += streak >= 2 ? 15 : 10;
    streak++;
    correctCount++;
  } else {
    btn.classList.add('wrong-anim');
    streak = 0;
    score = Math.max(0, score - 2);
  }

  updateScoreUI();

  // result box
  const rb = document.getElementById('resultBox');
  document.getElementById('resultIcon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('resultText').textContent = isCorrect ? q.success : q.fail;
  rb.className = 'result-box show ' + (isCorrect ? 'ok' : 'fail');

  // next button
  const nb = document.getElementById('nextBtn');
  nb.style.display = 'block';
  nb.textContent = current + 1 >= questions.length ? 'Ver resultados 🏆' : 'Siguiente incendio →';
}

function updateScoreUI(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    showEnd();
    return;
  }
  loadQuestion();
}

function showEnd(){
  document.getElementById('progressFill').style.width = '100%';
  const pct = Math.round((correctCount / questions.length) * 100);
  let ratingText = '';
  let trophy = '🏆';
  if(pct === 100){ ratingText = '¡Puntaje perfecto! Eres un <strong>experto brigadista</strong>. 🔥'; trophy = '🥇'; }
  else if(pct >= 75){ ratingText = '¡Muy bien! Tienes buenas bases para <strong>responder emergencias</strong>. Sigue practicando.'; trophy = '🏆'; }
  else if(pct >= 50){ ratingText = 'Vas por buen camino, pero hay conceptos clave que repasar. <strong>Inténtalo de nuevo.</strong>'; trophy = '🎯'; }
  else { ratingText = 'Necesitas reforzar el entrenamiento. <strong>¡La práctica hace al maestro!</strong>'; trophy = '📚'; }

  document.getElementById('gameArea').innerHTML = `
    <div class="end-screen">
      <span class="trophy">${trophy}</span>
      <div class="end-title">Entrenamiento Completo</div>
      <div class="end-score-label">Puntuación final</div>
      <div class="end-score-val">${score}</div>
      <div class="end-accuracy">${correctCount} / ${questions.length} respuestas correctas · ${pct}% precisión</div>
      <div class="rating">${ratingText}</div>
      <button class="replay-btn" onclick="location.reload()">Intentar Nuevamente 🔥</button>
    </div>
  `;
}

init();
</script>
</body>
</html>
