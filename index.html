<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔥 Safe/Game - Extintores</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --orange:#ff5500;
  --amber:#ffaa00;
  --dark:#0e0e0e;
  --card:#181818;
  --card2:#1f1f1f;
  --text:#f0f0f0;
  --muted:#888;
  --water:#1e88e5;
  --co2:#546e7a;
  --pqs:#ef6c00;
  --correct:#2e7d32;
  --wrong:#c62828;
}

body{
  background:var(--dark);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}

/* Background embers */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255,85,0,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 20%, rgba(255,170,0,0.06) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:440px;
}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:28px;
}
.header-icon{font-size:36px;line-height:1;}
.header-text{}
.header-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;letter-spacing:2px;
  color:var(--orange);
  line-height:1;
}
.header-sub{
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-top:2px;
}

/* ── PROGRESS ── */
.progress-wrap{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
}
.progress-bar{
  flex:1;height:6px;background:#2a2a2a;border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));
  border-radius:99px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.progress-label{
  font-size:13px;font-weight:700;color:var(--muted);
  white-space:nowrap;
}

/* ── SCORE ── */
.score-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}
.score-badge{
  background:var(--card2);
  border:1px solid #2e2e2e;
  border-radius:12px;
  padding:8px 16px;
  font-size:13px;color:var(--muted);
  display:flex;gap:6px;align-items:center;
}
.score-badge span{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:var(--amber);letter-spacing:1px;
}
.streak-badge{
  background:var(--card2);
  border:1px solid #2e2e2e;
  border-radius:12px;
  padding:8px 16px;
  font-size:13px;color:var(--muted);
  display:flex;gap:6px;align-items:center;
}
.streak-badge span{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;color:#ff5500;letter-spacing:1px;
}

/* ── FIRE CARD ── */
.fire-card{
  background:var(--card);
  border:1px solid #2a2a2a;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
  transition:border-color .3s;
}
.fire-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--amber),transparent);
  border-radius:20px 20px 0 0;
}

.class-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:#2a2a2a;border-radius:8px;
  padding:4px 10px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--amber);font-weight:700;
  margin-bottom:14px;
}

.fire-emoji{
  font-size:52px;
  display:block;
  margin-bottom:12px;
  animation:flicker 1.8s ease-in-out infinite;
}

@keyframes flicker{
  0%,100%{transform:scale(1) rotate(-1deg);filter:brightness(1);}
  30%{transform:scale(1.06) rotate(1deg);filter:brightness(1.2);}
  60%{transform:scale(.97) rotate(-2deg);filter:brightness(.9);}
  80%{transform:scale(1.04) rotate(1deg);filter:brightness(1.1);}
}

.fire-type{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;letter-spacing:1px;
  color:var(--text);margin-bottom:8px;
}
.fire-desc{
  font-size:14px;line-height:1.6;color:#aaa;
}

/* class badge */
.type-pill{
  display:inline-block;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  font-weight:700;
  padding:3px 10px;border-radius:99px;
  margin-top:12px;
}
.pill-a{background:rgba(255,85,0,.15);color:#ff7744;border:1px solid rgba(255,85,0,.3);}
.pill-b{background:rgba(255,170,0,.15);color:#ffcc44;border:1px solid rgba(255,170,0,.3);}
.pill-c{background:rgba(84,110,122,.2);color:#90a4ae;border:1px solid rgba(84,110,122,.4);}
.pill-k{background:rgba(85,139,47,.15);color:#8bc34a;border:1px solid rgba(85,139,47,.3);}

/* ── BUTTONS ── */
.buttons{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin-bottom:20px;
}
.opt-btn{
  background:var(--card2);
  border:1.5px solid #2e2e2e;
  border-radius:16px;
  padding:16px 12px;
  color:var(--text);
  font-family:'Barlow',sans-serif;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:all .25s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;overflow:hidden;
}
.opt-btn:not(:disabled):hover{
  transform:translateY(-3px);
  border-color:#444;
  background:#252525;
}
.opt-btn:not(:disabled):active{transform:scale(.97);}
.opt-btn .btn-icon{font-size:26px;}
.opt-btn .btn-label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}

.opt-btn.water{--accent:var(--water);}
.opt-btn.co2{--accent:var(--co2);}
.opt-btn.pqs{--accent:var(--pqs);}
.opt-btn.foam{--accent:var(--foam);}
.opt-btn.co2k{--accent:#7b1fa2;}

.opt-btn:not(:disabled):hover{border-color:var(--accent,#444);}

.opt-btn.correct-anim{
  border-color:#4caf50!important;
  background:rgba(76,175,80,.15)!important;
  animation:correctPop .4s ease;
}
.opt-btn.wrong-anim{
  border-color:#f44336!important;
  background:rgba(244,67,54,.12)!important;
  animation:wrongShake .4s ease;
}
.opt-btn.reveal-correct{
  border-color:#4caf50!important;
  background:rgba(76,175,80,.1)!important;
}

@keyframes correctPop{
  0%{transform:scale(1);}
  40%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  60%{transform:translateX(6px);}
}

.opt-btn:disabled{opacity:.55;cursor:default;}

/* ── RESULT ── */
.result-box{
  min-height:64px;
  border-radius:14px;
  padding:14px 16px;
  font-size:14px;line-height:1.6;
  font-weight:600;
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
  opacity:0;transform:translateY(6px);
  transition:all .3s ease;
}
.result-box.show{opacity:1;transform:translateY(0);}
.result-box.ok{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);color:#81c784;}
.result-box.fail{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);color:#e57373;}
.result-icon{font-size:22px;flex-shrink:0;}

/* ── NEXT BUTTON ── */
.next-btn{
  width:100%;
  background:linear-gradient(135deg,var(--orange),#ff8800);
  border:none;border-radius:14px;
  padding:16px;
  color:white;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2px;
  cursor:pointer;
  transition:all .25s;
  display:none;
}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,85,0,.4);}
.next-btn:active{transform:scale(.98);}

/* ── END SCREEN ── */
.end-screen{
  text-align:center;padding:10px;
}
.trophy{font-size:64px;display:block;animation:bounce .6s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-12px);}}

.end-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;letter-spacing:3px;
  color:var(--amber);margin-top:16px;
}
.end-score-label{margin-top:8px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.end-score-val{
  font-family:'Bebas Neue',sans-serif;
  font-size:72px;color:var(--orange);letter-spacing:2px;line-height:1;
}
.end-accuracy{
  font-size:14px;color:var(--muted);margin-top:4px;
}
.rating{
  margin:20px 0;
  font-size:14px;color:#ccc;line-height:1.7;
  background:var(--card2);border-radius:14px;padding:16px;
  border:1px solid #2a2a2a;
}
.rating strong{color:var(--amber);}

.replay-btn{
  width:100%;
  background:linear-gradient(135deg,var(--orange),#ff8800);
  border:none;border-radius:14px;
  padding:16px;
  color:white;
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;letter-spacing:2px;
  cursor:pointer;
  margin-top:8px;
  transition:all .25s;
}
.replay-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,85,0,.35);}

/* ── SLIDE-IN ── */
.slide-in{
  animation:slideIn .35s cubic-bezier(.4,0,.2,1);
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(18px);}
  to{opacity:1;transform:translateX(0);}
}

/* ── INTRO SCREEN ── */
.intro-dots{
  display:flex;justify-content:center;gap:8px;margin-bottom:24px;
}
.intro-dot{
  width:8px;height:8px;border-radius:99px;
  background:#2e2e2e;transition:all .3s;
}
.intro-dot.active{background:var(--orange);width:24px;}
.intro-card{
  background:var(--card);
  border:1px solid #2a2a2a;
  border-radius:20px;
  padding:28px 24px;
  margin-bottom:20px;
  position:relative;overflow:hidden;
  text-align:center;
  animation:slideIn .35s cubic-bezier(.4,0,.2,1);
}
.intro-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:20px 20px 0 0;
}
.intro-card.water-card::before{background:linear-gradient(90deg,#1565c0,#42a5f5,transparent);}
.intro-card.co2-card::before{background:linear-gradient(90deg,#37474f,#90a4ae,transparent);}
.intro-card.pqs-card::before{background:linear-gradient(90deg,#e65100,#ffb74d,transparent);}
.intro-card.co2k-card::before{background:linear-gradient(90deg,#4a148c,#ce93d8,transparent);}

.intro-big-icon{font-size:64px;display:block;margin-bottom:16px;animation:flicker 2s ease-in-out infinite;}
.intro-ext-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;letter-spacing:3px;margin-bottom:6px;
}
.intro-ext-name.water-txt{color:#42a5f5;}
.intro-ext-name.co2-txt{color:#90a4ae;}
.intro-ext-name.pqs-txt{color:#ffb74d;}
.intro-ext-name.co2k-txt{color:#ce93d8;}

.intro-tagline{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
.intro-desc{font-size:14px;line-height:1.7;color:#bbb;margin-bottom:20px;text-align:left;}
.intro-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:4px;}
.intro-tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:99px;}
.tag-yes{background:rgba(76,175,80,.15);color:#81c784;border:1px solid rgba(76,175,80,.3);}
.tag-no{background:rgba(244,67,54,.1);color:#e57373;border:1px solid rgba(244,67,54,.25);}

.intro-nav{display:flex;gap:12px;}
.intro-prev-btn,.intro-next-btn,.intro-start-btn,.intro-skip-btn{
  border:none;border-radius:14px;
  padding:14px 20px;
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:2px;
  cursor:pointer;transition:all .25s;
}
.intro-prev-btn{background:#2a2a2a;color:var(--muted);flex:0 0 auto;}
.intro-prev-btn:hover{background:#333;color:var(--text);}
.intro-next-btn{background:linear-gradient(135deg,var(--orange),#ff8800);color:white;flex:1;}
.intro-next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,85,0,.35);}
.intro-start-btn{background:linear-gradient(135deg,#2e7d32,#43a047);color:white;flex:1;}
.intro-start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,125,50,.35);}
.intro-skip-btn{
  width:100%;background:transparent;
  border:1px solid #2e2e2e!important;
  color:var(--muted);font-size:13px;letter-spacing:2px;
  margin-top:10px;padding:11px;
}
.intro-skip-btn:hover{color:var(--text);border-color:#444!important;background:#1a1a1a;}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-icon">🧯</div>
    <div class="header-text">
      <div class="header-title">SAFE/GAME</div>
      <div class="header-sub">Entrenamiento de Brigada</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">1 / 8</div>
  </div>

  <!-- SCORE ROW -->
  <div class="score-row">
    <div class="score-badge">⭐ Puntos <span id="scoreVal">0</span></div>
    <div class="streak-badge">🔥 Racha <span id="streakVal">0</span></div>
  </div>

  <!-- INTRO SCREEN -->
  <div id="introScreen">
    <div class="intro-dots" id="introDots"></div>
    <div id="introCard"></div>
    <div class="intro-nav" id="introNav"></div>
    <button class="intro-skip-btn" onclick="startGame()">⚡ Saltar al juego</button>
  </div>

  <!-- GAME AREA -->
  <div id="gameArea" style="display:none">

    <!-- FIRE CARD -->
    <div class="fire-card" id="fireCard">
      <div class="class-tag" id="classTag">🏷 CLASE X</div>
      <div class="fire-emoji" id="fireEmoji">🔥</div>
      <div class="fire-type" id="fireType">Cargando...</div>
      <div class="fire-desc" id="fireDesc">...</div>
      <div class="type-pill" id="typePill"></div>
    </div>

    <!-- OPTIONS -->
    <div class="buttons" id="buttonsArea"></div>

    <!-- RESULT -->
    <div class="result-box" id="resultBox">
      <span class="result-icon" id="resultIcon"></span>
      <span id="resultText"></span>
    </div>

    <!-- NEXT -->
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
      Siguiente incendio →
    </button>

  </div>

</div>

<script>
/* ── AUDIO ── */
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playCorrect(){
  const t = AC.currentTime;
  [523,659,784].forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t+i*.1);
    g.gain.linearRampToValueAtTime(.18,t+i*.1+.03);
    g.gain.linearRampToValueAtTime(0,t+i*.1+.18);
    o.start(t+i*.1); o.stop(t+i*.1+.2);
  });
}

function playWrong(){
  const t = AC.currentTime;
  [220,180].forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=f; o.type='sawtooth';
    g.gain.setValueAtTime(0,t+i*.12);
    g.gain.linearRampToValueAtTime(.12,t+i*.12+.04);
    g.gain.linearRampToValueAtTime(0,t+i*.12+.2);
    o.start(t+i*.12); o.stop(t+i*.12+.25);
  });
}

function playFanfare(){
  const t = AC.currentTime;
  const notes=[523,659,784,1047];
  notes.forEach((f,i)=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0,t+i*.13);
    g.gain.linearRampToValueAtTime(.2,t+i*.13+.05);
    g.gain.linearRampToValueAtTime(0,t+i*.13+.3);
    o.start(t+i*.13); o.stop(t+i*.13+.35);
  });
}

/* ── INTRO DATA ── */
const INTRO_CARDS = [
  {
    cls:"water-card", icon:"💧", nameCls:"water-txt", name:"EXTINTOR DE AGUA",
    tagline:"Clase A · Sólidos combustibles",
    desc:"El extintor de agua enfría el material en combustión, eliminando el calor y apagando el fuego. Es el más común para materiales sólidos como madera, papel, tela y cartón.",
    yes:["✅ Madera y papel","✅ Tela y cartón","✅ Plásticos sólidos"],
    no:["🚫 Fuegos eléctricos","🚫 Aceites y grasas","🚫 Líquidos inflamables"]
  },
  {
    cls:"co2-card", icon:"❄️", nameCls:"co2-txt", name:"EXTINTOR CO₂",
    tagline:"Clase B/C · Eléctrico y líquidos",
    desc:"El dióxido de carbono desplaza el oxígeno y sofoca el fuego sin dejar residuo. Es dieléctrico (no conduce electricidad), por lo que es seguro en equipos energizados.",
    yes:["✅ Equipos eléctricos","✅ Solventes y líquidos","✅ Laboratorios"],
    no:["🚫 Materiales sólidos","🚫 Espacios abiertos (se dispersa)","🚫 Metales en combustión"]
  },
  {
    cls:"pqs-card", icon:"🧡", nameCls:"pqs-txt", name:"EXTINTOR PQS",
    tagline:"Clase A/B · Polvo Químico Seco",
    desc:"El Polvo Químico Seco interrumpe la reacción química del fuego. Es versátil y muy eficaz, pero deja residuo en polvo que puede dañar equipos delicados. Ideal en vehículos y talleres.",
    yes:["✅ Combustibles líquidos","✅ Vehículos","✅ Talleres industriales"],
    no:["🚫 Equipos eléctricos delicados","🚫 Cocinas con aceite","🚫 Ambientes limpios o laboratorios"]
  },
  {
    cls:"co2k-card", icon:"🍳", nameCls:"co2k-txt", name:"EXTINTOR CLASE K",
    tagline:"Clase K · Aceites y grasas de cocina",
    desc:"Diseñado específicamente para aceites y grasas vegetales o animales a alta temperatura. Aplica un agente que saponifica (solidifica) la grasa y sofoca las llamas sin provocar salpicaduras explosivas.",
    yes:["✅ Freidoras industriales","✅ Cocinas de restaurant","✅ Aceites y grasas calientes"],
    no:["🚫 NUNCA usar agua en aceite","🚫 Equipos eléctricos","🚫 Solventes inflamables"]
  }
];

let introIdx = 0;

function renderIntro(){
  // dots
  const dots = document.getElementById('introDots');
  dots.innerHTML = INTRO_CARDS.map((_,i)=>
    `<div class="intro-dot${i===introIdx?' active':''}"></div>`
  ).join('');

  // card
  const c = INTRO_CARDS[introIdx];
  document.getElementById('introCard').innerHTML = `
    <div class="intro-card ${c.cls}">
      <span class="intro-big-icon">${c.icon}</span>
      <div class="intro-ext-name ${c.nameCls}">${c.name}</div>
      <div class="intro-tagline">${c.tagline}</div>
      <div class="intro-desc">${c.desc}</div>
      <div class="intro-tags">
        ${c.yes.map(t=>`<span class="intro-tag tag-yes">${t}</span>`).join('')}
        ${c.no.map(t=>`<span class="intro-tag tag-no">${t}</span>`).join('')}
      </div>
    </div>
  `;

  // nav
  const isLast = introIdx === INTRO_CARDS.length - 1;
  document.getElementById('introNav').innerHTML = `
    ${introIdx > 0
      ? `<button class="intro-prev-btn" onclick="introGo(-1)">← Anterior</button>`
      : ''}
    ${isLast
      ? `<button class="intro-start-btn" onclick="startGame()">🔥 ¡Comenzar!</button>`
      : `<button class="intro-next-btn" onclick="introGo(1)">Siguiente →</button>`}
  `;
}

function introGo(dir){
  introIdx = Math.min(Math.max(introIdx + dir, 0), INTRO_CARDS.length - 1);
  renderIntro();
}

function startGame(){
  document.getElementById('introScreen').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  init();
}

/* ── GAME DATA ── */
const ALL_QUESTIONS = [
  {
    type:"Incendio Eléctrico",emoji:"⚡",classTag:"CLASE C",pill:"pill-c",
    pillText:"Clase C · Equipos eléctricos",
    desc:"Un tablero eléctrico comenzó a arder por un cortocircuito. El área está bajo tensión.",
    correct:"CO2",options:["Agua","CO2","PQS"],
    success:"El CO₂ no conduce electricidad y no daña los equipos. ¡Elección perfecta!",

const EXTINGUISHERS = {
  "Agua":  {icon:"💧", label:"AGUA",  cls:"water"},
  "CO2":   {icon:"❄️", label:"CO₂",   cls:"co2"},
  "PQS":   {icon:"🧡", label:"PQS",   cls:"pqs"},
  "CO2/K": {icon:"❄️", label:"CO₂/K", cls:"co2k"},
};

let questions=[], current=0, score=0, streak=0, correctCount=0, answered=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function init(){
  questions=shuffle(ALL_QUESTIONS);
  current=0;score=0;streak=0;correctCount=0;
  updateScoreUI();loadQuestion();
}

function loadQuestion(){
  answered=false;
  const q=questions[current];
  const pct=(current/questions.length)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=(current+1)+' / '+questions.length;
  document.getElementById('classTag').textContent='🏷 '+q.classTag;
  document.getElementById('fireEmoji').textContent=q.emoji;
  document.getElementById('fireType').textContent=q.type;
  document.getElementById('fireDesc').textContent=q.desc;
  const pill=document.getElementById('typePill');
  pill.className='type-pill '+q.pill;
  pill.textContent=q.pillText;
  document.getElementById('fireCard').classList.add('slide-in');
  setTimeout(()=>document.getElementById('fireCard').classList.remove('slide-in'),400);

  const area=document.getElementById('buttonsArea');
  area.innerHTML='';
  shuffle(q.options).forEach(opt=>{
    const e=EXTINGUISHERS[opt];
    const btn=document.createElement('button');
    btn.className='opt-btn '+e.cls;
    btn.innerHTML=`<span class="btn-icon">${e.icon}</span>🧯<br><span class="btn-label">${e.label}</span>`;
    btn.onclick=()=>checkAnswer(opt,btn);
    area.appendChild(btn);
  });

  const rb=document.getElementById('resultBox');
  rb.className='result-box';
  document.getElementById('resultIcon').textContent='';
  document.getElementById('resultText').textContent='';
  document.getElementById('nextBtn').style.display='none';
}

function checkAnswer(chosen,btn){
  if(answered)return;
  answered=true;
  // unlock AudioContext on first interaction
  if(AC.state==='suspended') AC.resume();

  const q=questions[current];
  const isCorrect=chosen===q.correct;

  document.querySelectorAll('#buttonsArea .opt-btn').forEach(b=>{
    b.disabled=true;
    const lbl=b.querySelector('.btn-label').textContent;
    const optKey=Object.keys(EXTINGUISHERS).find(k=>EXTINGUISHERS[k].label===lbl);
    if(optKey===q.correct) b.classList.add('reveal-correct');
  });

  if(isCorrect){
    btn.classList.add('correct-anim');
    score+=streak>=2?15:10;
    streak++;correctCount++;
    playCorrect();
  } else {
    btn.classList.add('wrong-anim');
    streak=0;score=Math.max(0,score-2);
    playWrong();
  }

  updateScoreUI();
  const rb=document.getElementById('resultBox');
  document.getElementById('resultIcon').textContent=isCorrect?'✅':'❌';
  document.getElementById('resultText').textContent=isCorrect?q.success:q.fail;
  rb.className='result-box show '+(isCorrect?'ok':'fail');
  const nb=document.getElementById('nextBtn');
  nb.style.display='block';
  nb.textContent=current+1>=questions.length?'Ver resultados 🏆':'Siguiente incendio →';
}

function updateScoreUI(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('streakVal').textContent=streak;
}

function nextQuestion(){
  current++;
  if(current>=questions.length){showEnd();return;}
  loadQuestion();
}

function showEnd(){
  document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((correctCount/questions.length)*100);
  let ratingText='',trophy='🏆';
  if(pct===100){ratingText='¡Puntaje perfecto! Eres un <strong>experto brigadista</strong>. 🔥';trophy='🥇';playFanfare();}
  else if(pct>=75){ratingText='¡Muy bien! Tienes buenas bases para <strong>responder emergencias</strong>. Sigue practicando.';trophy='🏆';}
  else if(pct>=50){ratingText='Vas por buen camino, pero hay conceptos clave que repasar. <strong>Inténtalo de nuevo.</strong>';trophy='🎯';}
  else{ratingText='Necesitas reforzar el entrenamiento. <strong>¡La práctica hace al maestro!</strong>';trophy='📚';}

  document.getElementById('gameArea').innerHTML=`
    <div class="end-screen">
      <span class="trophy">${trophy}</span>
      <div class="end-title">Entrenamiento Completo</div>
      <div class="end-score-label">Puntuación final</div>
      <div class="end-score-val">${score}</div>
      <div class="end-accuracy">${correctCount} / ${questions.length} respuestas correctas · ${pct}% precisión</div>
      <div class="rating">${ratingText}</div>
      <button class="replay-btn" onclick="location.reload()">Intentar Nuevamente 🔥</button>
    </div>
  `;
}

// Start with intro
renderIntro();
</script>
